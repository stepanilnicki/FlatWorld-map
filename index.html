<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b120e">
  <title>FlatWorld — Server Map</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b120e;
      --surface: #131e17;
      --surface-2: #19271e;
      --surface-3: #203328;
      --line: rgba(210, 235, 214, .13);
      --line-strong: rgba(210, 235, 214, .22);
      --text: #f0f6f0;
      --muted: #9eb1a1;
      --green: #9be394;
      --green-dim: rgba(155, 227, 148, .13);
      --shadow: 0 24px 70px rgba(0, 0, 0, .30);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 22px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 22px;
      align-items: stretch;
      color: var(--text);
      background:
        radial-gradient(ellipse at 18% 8%, rgba(69, 119, 78, .17), transparent 36%),
        radial-gradient(ellipse at 90% 90%, rgba(45, 87, 56, .12), transparent 34%),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .map-stage {
      min-width: 0;
      min-height: calc(100vh - 44px);
      min-height: calc(100dvh - 44px);
      display: grid;
      place-items: center;
      padding: 18px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(255,255,255,.035), rgba(255,255,255,.008));
      box-shadow: var(--shadow);
    }

    .map-frame {
      --axis-left: 62px;
      --axis-top: 38px;
      display: grid;
      grid-template-columns: var(--axis-left) minmax(0, 1fr);
      grid-template-rows: var(--axis-top) minmax(0, 1fr);
      width: min(100%, calc(100dvh - 84px + 48px));
      min-width: 0;
      align-items: stretch;
    }
    .axis {
      position: relative;
      color: #c5d8c5;
      font: 500 10px/1 system-ui, sans-serif;
      user-select: none;
      pointer-events: none;
    }
    .axis-x {
      grid-column: 2;
      grid-row: 1;
    }
    .axis-x::before {
      content: "X";
      position: absolute;
      left: 2px;
      top: 4px;
      color: #9be394;
      font-weight: 800;
      letter-spacing: .04em;
    }
    .axis-z {
      grid-column: 1;
      grid-row: 2;
    }
    .axis-z::before {
      content: "Z";
      position: absolute;
      left: 5px;
      top: 3px;
      color: #9be394;
      font-weight: 800;
      letter-spacing: .04em;
    }
    .axis-tick {
      position: absolute;
      white-space: nowrap;
      opacity: .9;
      text-shadow: 0 1px 3px rgba(0,0,0,.45);
    }
    .axis-x .axis-tick {
      top: 21px;
      transform: translateX(-50%);
    }
    .axis-z .axis-tick {
      right: 7px;
      transform: translateY(-50%);
    }
    #mapCanvas {
      grid-column: 2;
      grid-row: 2;
      display: block;
      width: 100%;
      height: 100%;
      aspect-ratio: 1;
      border: 1px solid rgba(224, 255, 220, .30);
      border-radius: 13px;
      background: #4e9a46;
      box-shadow: 0 14px 38px rgba(0,0,0,.30), 0 0 0 5px rgba(255,255,255,.025);
      touch-action: manipulation;
      cursor: crosshair;
    }

    .sidebar {
      min-width: 0;
      align-self: center;
      display: flex;
      flex-direction: column;
      gap: 19px;
      padding: 23px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: linear-gradient(155deg, rgba(27, 42, 32, .98), rgba(17, 27, 21, .98));
      box-shadow: var(--shadow);
    }

    .heading {
      padding: 1px 1px 17px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      display: flex;
      align-items: center;
      gap: 11px;
      margin: 0 0 8px;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: -.035em;
      font-weight: 760;
    }

    h1::before {
      content: "";
      width: 10px;
      height: 10px;
      flex: 0 0 10px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 17px rgba(155, 227, 148, .7);
    }

    .scale-note {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .015em;
    }

    .marker-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }

    .marker-btn {
      min-width: 0;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: rgba(255,255,255,.035);
      color: #e8f0e9;
      font: inherit;
      font-size: 13px;
      font-weight: 720;
      text-align: left;
      cursor: pointer;
      transition: background .18s ease, border-color .18s ease, transform .18s ease;
    }

    .marker-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(155,227,148,.48);
      background: var(--green-dim);
    }

    .marker-btn.active {
      border-color: rgba(155,227,148,.78);
      background: linear-gradient(135deg, rgba(116,176,108,.25), rgba(116,176,108,.09));
      color: #c9f4c4;
      box-shadow: inset 0 0 0 1px rgba(155,227,148,.08);
    }

    .marker-btn .arrow { color: #718b76; font-size: 13px; }
    .marker-btn.active .arrow { color: var(--green); }
    .marker-btn:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }

    .info-card {
      height: 174px;
      min-height: 174px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: linear-gradient(145deg, rgba(5,12,7,.48), rgba(255,255,255,.025));
      color: #dce9de;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .empty {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.65;
    }
    .empty::before { content: "ⓘ"; color: var(--green); font-size: 15px; }
    .flag-slot {
      height: 44px;
      display: flex;
      align-items: flex-start;
      margin-bottom: 4px;
    }
    .info-card img {
      display: block;
      width: auto;
      height: 36px;
      max-width: 110px;
      object-fit: contain;
      margin-bottom: 10px;
      border: 1px solid var(--line-strong);
      border-radius: 4px;
    }
    .info-title {
      margin-bottom: 7px;
      color: var(--green);
      font-size: 15px;
      font-weight: 760;
    }
    .info-coords {
      color: #bdcdbf;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.75;
    }

    @media (max-width: 900px) and (min-width: 701px) {
      body { grid-template-columns: minmax(0, 1fr) 285px; gap: 15px; padding: 15px; }
      .map-stage { min-height: calc(100dvh - 30px); padding: 12px; }
      .sidebar { padding: 18px; gap: 15px; }
      .map-frame { width: min(100%, calc(100dvh - 70px + 48px)); }
    }

    @media (max-width: 700px) {
      body {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 14px;
        padding: max(10px, env(safe-area-inset-top)) 10px max(16px, env(safe-area-inset-bottom));
      }
      .map-stage {
        min-height: 0;
        width: 100%;
        padding: 8px;
        border-radius: 17px;
      }
      .map-frame {
        --axis-left: 42px;
        --axis-top: 24px;
        width: min(100%, calc(58dvh + 42px));
      }
      .axis { font-size: 9px; }
      .axis-x .axis-tick { top: 19px; }
      #mapCanvas { border-radius: 11px; }
      .sidebar { padding: 18px; gap: 16px; border-radius: 17px; }
      h1 { font-size: 20px; }
      .marker-list { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
      .marker-btn { min-height: 43px; padding: 9px 10px; font-size: 12px; }
      .info-card { height: 166px; min-height: 166px; }
    }

    @media (max-width: 370px) {
      .marker-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .sidebar { padding: 15px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="map-stage" aria-label="World map">
    <div class="map-frame" id="mapFrame">
      <div class="axis axis-x" id="axisX" aria-hidden="true"></div>
      <div class="axis axis-z" id="axisZ" aria-hidden="true"></div>
      <canvas id="mapCanvas" aria-label="Interactive FlatWorld map"></canvas>
    </div>
  </main>

  <aside class="sidebar">
    <header class="heading">
      <h1>World Map</h1>
      <div class="scale-note">Scale: 1 px = 85 blocks</div>
    </header>

    <nav class="marker-list" id="markerList" aria-label="Map locations"></nav>

    <section class="info-card" id="infoCard" aria-live="polite">
      <div class="empty">Click a marker on the map or in the list to view its name and coordinates.</div>
    </section>
  </aside>

  <script>
    "use strict";

    // World boundaries and original map scale.
    const MIN_X = -30912;
    const MAX_X = 30927;
    const MIN_Z = -30912;
    const MAX_Z = 30927;
    const BLOCKS_PER_PX = 85;

    const worldWidth = MAX_X - MIN_X;
    const worldHeight = MAX_Z - MIN_Z;

    const canvas = document.getElementById("mapCanvas");
    const ctx = canvas.getContext("2d", { alpha: false });
    const stage = document.querySelector(".map-stage");
    const mapFrame = document.getElementById("mapFrame");
    const axisX = document.getElementById("axisX");
    const axisZ = document.getElementById("axisZ");
    const markerListEl = document.getElementById("markerList");
    const infoCardEl = document.getElementById("infoCard");

    // Original marker data retained.
    const markers = [
      { id: "zero", shortName: "0", fullName: "Zero point (X: 0, Z: 0)", x: 0, z: 0, color: "#FF0000" },
      { id: "spw", shortName: "SPW", fullName: "Current spawn", x: -2208, z: 10599, color: "#20B2AA" },
      { id: "ith", shortName: "ITH", fullName: "Irpinśka Terrytoriaľna Hromada", x: -23105, z: 12000, flag: "ithflag.png" },
      { id: "srb", shortName: "SRB", fullName: "Serbia", x: 29679, z: 10610, flag: "serbia.png", color: "#00008B" },
      { id: "pks", shortName: "PKS", fullName: "Pakistan", x: 24364, z: 8529, flag: "pakistan.png", color: "#006400" },
      { id: "eml", shortName: "EML", fullName: "Emasland", x: -17023, z: 25780, flag: "emaslandflag.png", color: "#FFFF00" },
      { id: "bgt", shortName: "BGT", fullName: "Bigtopia", x: -1605, z: 21090, color: "#4682B4" }
    ];

    let selectedMarkerId = null;
    let viewWidth = 0;
    let viewHeight = 0;
    let currentScale = 1 / BLOCKS_PER_PX;

    function resizeCanvas() {
      const isMobile = window.matchMedia("(max-width: 700px)").matches;
      const stageStyle = getComputedStyle(stage);
      const padX = parseFloat(stageStyle.paddingLeft) + parseFloat(stageStyle.paddingRight);
      const padY = parseFloat(stageStyle.paddingTop) + parseFloat(stageStyle.paddingBottom);
      const axisLeft = isMobile ? 54 : 62;
      const axisTop = isMobile ? 34 : 38;

      const availableWidth = Math.max(180, stage.clientWidth - padX - axisLeft);
      const availableHeight = isMobile
        ? window.innerHeight * 0.58
        : stage.clientHeight - padY - axisTop;

      const side = Math.max(180, Math.floor(Math.min(availableWidth, availableHeight)));
      viewWidth = side;
      viewHeight = side;

      mapFrame.style.width = (side + axisLeft) + "px";
      mapFrame.style.height = (side + axisTop) + "px";

      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      canvas.style.width = side + "px";
      canvas.style.height = side + "px";
      canvas.width = Math.round(side * dpr);
      canvas.height = Math.round(side * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      currentScale = viewWidth / worldWidth;
      renderAxes();
      drawMap();
    }

    function renderAxes() {
      axisX.replaceChildren();
      axisZ.replaceChildren();

      const values = [-30000, -20000, -10000, 0, 10000, 20000, 30000];

      values.forEach((value, index) => {
        const x = (value - MIN_X) / worldWidth * viewWidth;
        const showX = viewWidth >= 390 || index % 2 === 0;
        if (showX) {
          const xTick = document.createElement("span");
          xTick.className = "axis-tick";
          xTick.textContent = String(value);
          xTick.style.left = Math.max(2, Math.min(viewWidth - 2, x)) + "px";
          if (x < 28) xTick.style.transform = "translateX(0)";
          else if (x > viewWidth - 28) xTick.style.transform = "translateX(-100%)";
          axisX.appendChild(xTick);
        }

        const y = (value - MIN_Z) / worldHeight * viewHeight;
        const zTick = document.createElement("span");
        zTick.className = "axis-tick";
        zTick.textContent = String(value);
        zTick.style.top = Math.max(17, Math.min(viewHeight - 2, y)) + "px";
        axisZ.appendChild(zTick);
      });
    }

    function worldToCanvas(x, z) {
      return {
        px: (x - MIN_X) * currentScale,
        py: (z - MIN_Z) * currentScale
      };
    }

    function drawCoordinateTag(text, x, y, align, baseline) {
      ctx.save();
      ctx.font = "500 11px system-ui, -apple-system, sans-serif";
      const width = ctx.measureText(text).width;
      const height = 16;
      let left = align === "center" ? x - width / 2 : align === "right" ? x - width : x;
      let top = baseline === "bottom" ? y - height : y;

      left = Math.max(5, Math.min(viewWidth - width - 5, left));
      top = Math.max(4, Math.min(viewHeight - height - 4, top));

      // Small translucent backing keeps coordinates readable over the grid.
      ctx.fillStyle = "rgba(28, 66, 31, .48)";
      ctx.beginPath();
      ctx.roundRect(left - 3, top - 1, width + 6, height, 4);
      ctx.fill();

      ctx.fillStyle = "rgba(245, 255, 242, .88)";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillText(text, left, top + 1);
      ctx.restore();
    }

    function drawMap() {
      ctx.clearRect(0, 0, viewWidth, viewHeight);
      ctx.fillStyle = "#4e9a46";
      ctx.fillRect(0, 0, viewWidth, viewHeight);

      // Subtle inner edge for a clean map surface.
      ctx.strokeStyle = "rgba(255,255,255,.18)";
      ctx.lineWidth = 1;
      ctx.strokeRect(.5, .5, viewWidth - 1, viewHeight - 1);

      const gridStep = 10000;
      const gridValues = [];
      for (let value = -30000; value <= 30000; value += gridStep) gridValues.push(value);

      // Grid lines.
      gridValues.forEach(value => {
        const x = worldToCanvas(value, 0).px;
        const y = worldToCanvas(0, value).py;

        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, viewHeight);
        ctx.strokeStyle = value === 0 ? "rgba(255,255,255,.38)" : "rgba(255,255,255,.15)";
        ctx.lineWidth = value === 0 ? 1.5 : 1;
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(viewWidth, y);
        ctx.strokeStyle = value === 0 ? "rgba(255,255,255,.38)" : "rgba(255,255,255,.15)";
        ctx.lineWidth = value === 0 ? 1.5 : 1;
        ctx.stroke();
      });

      // Coordinate values are rendered in separate HTML axis gutters,
      // outside the green map area, so they cannot overlap map markers.
      // Marker dots and names.
      markers.forEach(marker => {
        const { px, py } = worldToCanvas(marker.x, marker.z);
        const selected = marker.id === selectedMarkerId;
        const radius = selected ? 5.5 : 4.5;

        ctx.save();
        ctx.beginPath();
        ctx.arc(px, py, radius, 0, Math.PI * 2);
        ctx.fillStyle = marker.color || "#111";
        ctx.fill();
        ctx.lineWidth = selected ? 2 : 1.5;
        ctx.strokeStyle = selected ? "#b8ffad" : "#fff";
        ctx.stroke();

        const fontSize = Math.max(11, Math.min(13, viewWidth / 48));
        ctx.font = `700 ${fontSize}px system-ui, -apple-system, sans-serif`;
        ctx.textBaseline = "middle";
        ctx.textAlign = "left";
        const labelWidth = ctx.measureText(marker.shortName).width;
        const gap = radius + 6;
        let labelX = px + gap;
        if (labelX + labelWidth + 5 > viewWidth) labelX = px - gap - labelWidth;
        labelX = Math.max(5, Math.min(viewWidth - labelWidth - 5, labelX));

        ctx.lineWidth = 3;
        ctx.lineJoin = "round";
        ctx.strokeStyle = "rgba(18, 30, 19, .88)";
        ctx.strokeText(marker.shortName, labelX, py);
        ctx.fillStyle = "#fff";
        ctx.fillText(marker.shortName, labelX, py);
        ctx.restore();
      });
    }

    function selectMarker(id) {
      selectedMarkerId = id;
      const marker = markers.find(item => item.id === id);

      markerListEl.querySelectorAll(".marker-btn").forEach(button => {
        const active = button.dataset.id === id;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });

      infoCardEl.replaceChildren();

      if (!marker) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Click a marker on the map or in the list to view its name and coordinates.";
        infoCardEl.appendChild(empty);
      } else {
        const flagSlot = document.createElement("div");
        flagSlot.className = "flag-slot";
        if (marker.flag) {
          const image = document.createElement("img");
          image.src = marker.flag;
          image.alt = marker.shortName + " flag";
          image.onerror = () => image.remove();
          flagSlot.appendChild(image);
        }
        infoCardEl.appendChild(flagSlot);

        const title = document.createElement("div");
        title.className = "info-title";
        title.textContent = marker.fullName;

        const shortName = document.createElement("div");
        shortName.className = "info-coords";
        shortName.textContent = "Short name: " + marker.shortName;

        const coords = document.createElement("div");
        coords.className = "info-coords";
        coords.textContent = `X: ${marker.x}, Z: ${marker.z}`;

        infoCardEl.append(title, shortName, coords);
      }

      drawMap();
    }

    function renderMarkerButtons() {
      markerListEl.replaceChildren();
      markers.forEach(marker => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "marker-btn";
        button.dataset.id = marker.id;
        button.setAttribute("aria-pressed", "false");

        const name = document.createElement("span");
        name.textContent = marker.shortName;
        const arrow = document.createElement("span");
        arrow.className = "arrow";
        arrow.textContent = "↗";

        button.append(name, arrow);
        button.addEventListener("click", () => selectMarker(marker.id));
        markerListEl.appendChild(button);
      });
    }

    canvas.addEventListener("click", event => {
      const rect = canvas.getBoundingClientRect();
      const clickX = (event.clientX - rect.left) * (viewWidth / rect.width);
      const clickY = (event.clientY - rect.top) * (viewHeight / rect.height);

      let closest = null;
      let closestDistance = 16;

      markers.forEach(marker => {
        const { px, py } = worldToCanvas(marker.x, marker.z);
        const distance = Math.hypot(clickX - px, clickY - py);
        if (distance < closestDistance) {
          closest = marker;
          closestDistance = distance;
        }
      });

      selectMarker(closest ? closest.id : null);
    });

    renderMarkerButtons();
    selectMarker(null);

    // ResizeObserver catches layout changes as well as device rotation.
    if ("ResizeObserver" in window) {
      new ResizeObserver(resizeCanvas).observe(stage);
    } else {
      window.addEventListener("resize", resizeCanvas);
    }
    window.addEventListener("orientationchange", () => setTimeout(resizeCanvas, 100));
    resizeCanvas();
  </script>
</body>
</html>
